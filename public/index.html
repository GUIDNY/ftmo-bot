<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTMO Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F0F13;--card:#17171E;--border:#2A2A35;
  --text:#F0F0F5;--text2:#888;
  --green:#22C55E;--red:#EF4444;--gold:#F59E0B;--blue:#3B82F6;
}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

header{padding:20px 32px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:800;letter-spacing:-0.5px}
.logo span{color:var(--gold)}
.status{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

main{max-width:1100px;margin:0 auto;padding:28px 24px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 18px}
.stat-label{font-size:12px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.stat-val{font-size:28px;font-weight:800;line-height:1}
.stat-val.green{color:var(--green)}.stat-val.red{color:var(--red)}.stat-val.gold{color:var(--gold)}.stat-val.blue{color:var(--blue)}

.progress-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 18px;margin-bottom:24px}
.progress-label{font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between}
.bar-wrap{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:16px}
.bar{height:100%;border-radius:4px;transition:width .6s ease}
.bar.red{background:var(--red)}

.table-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.table-title{font-size:14px;font-weight:700}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}

table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;padding:12px 16px;text-align:right;border-bottom:1px solid var(--border)}
td{padding:14px 16px;font-size:13px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

.dir-long{color:var(--green);font-weight:700}
.dir-short{color:var(--red);font-weight:700}
.result-win{color:var(--green);font-weight:700}
.result-loss{color:var(--red);font-weight:700}
.result-open{color:var(--gold)}
.result-rejected{color:var(--text2)}
.pair{font-weight:700;font-family:monospace}
.rr-good{color:var(--green)}
.rr-bad{color:var(--gold)}
.lesson{font-size:11px;color:var(--text2);font-style:italic;margin-top:3px}
.fail-reason{font-size:11px;color:var(--red);margin-top:2px}

.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:12px}

@media(max-width:768px){
  .stats{grid-template-columns:repeat(2,1fr)}
  th:nth-child(n+5),td:nth-child(n+5){display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo">FTMO <span>Journal</span></div>
  <div class="status"><div class="dot"></div><span id="lastSync">טוען...</span></div>
</header>

<main>
  <div class="stats">
    <div class="stat"><div class="stat-label">סה"כ עסקות</div><div class="stat-val" id="sTotal">—</div></div>
    <div class="stat"><div class="stat-label">Win Rate</div><div class="stat-val gold" id="sWinRate">—</div></div>
    <div class="stat"><div class="stat-label">P&L מצטבר</div><div class="stat-val" id="sPnl">—</div></div>
    <div class="stat"><div class="stat-label">נדחו בצ'קליסט</div><div class="stat-val red" id="sRejected">—</div></div>
  </div>

  <div class="progress-card" id="failSection" style="display:none">
    <div style="font-size:14px;font-weight:700;margin-bottom:16px">למה נדחו עסקות</div>
    <div id="failBreakdown"></div>
  </div>

  <div class="table-card">
    <div class="table-hd">
      <span class="table-title">יומן עסקות</span>
      <span id="tradeCount" class="badge badge-green">0 עסקות</span>
    </div>
    <div id="tableBody"></div>
  </div>
</main>

<script>
async function load(){
  try{
    const res=await fetch("/api/trades");
    const trades=await res.json();
    render(trades);
    document.getElementById("lastSync").textContent="עדכון "+new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
  }catch(e){console.error(e)}
}

function render(trades){
  const total=trades.length;
  const completed=trades.filter(t=>t.result!=null);
  const wins=completed.filter(t=>t.result>0).length;
  const winRate=completed.length?Math.round(wins/completed.length*100):0;
  const pnl=completed.reduce((s,t)=>s+(t.result||0),0);
  const rejected=trades.filter(t=>!t.checklistPassed).length;

  document.getElementById("sTotal").textContent=total;
  document.getElementById("sWinRate").textContent=completed.length?winRate+"%":"—";
  const pnlEl=document.getElementById("sPnl");
  pnlEl.textContent=(pnl>=0?"+":"")+"$"+Math.abs(pnl).toLocaleString();
  pnlEl.className="stat-val "+(pnl>=0?"green":"red");
  document.getElementById("sRejected").textContent=rejected;
  document.getElementById("tradeCount").textContent=total+" עסקות";

  // Fail breakdown
  const failed=trades.filter(t=>!t.checklistPassed);
  if(failed.length){
    document.getElementById("failSection").style.display="block";
    const counts={};
    failed.forEach(t=>{const r=t.failReason||"לא ידוע";counts[r]=(counts[r]||0)+1});
    document.getElementById("failBreakdown").innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([reason,count])=>{
      const pct=Math.round(count/failed.length*100);
      const clean=reason.replace(/🛑\s*/,"");
      return `<div style="margin-bottom:12px"><div class="progress-label"><span>${clean}</span><span style="color:var(--red)">${count}x</span></div><div class="bar-wrap"><div class="bar red" style="width:${pct}%"></div></div></div>`;
    }).join("");
  }

  // Table
  const tbody=document.getElementById("tableBody");
  if(!trades.length){
    tbody.innerHTML=`<div class="empty"><div class="empty-icon">📭</div><p>אין עסקות עדיין<br><small>שלח "עסקה חדשה" לבוט כדי להתחיל</small></p></div>`;
    return;
  }

  const sorted=[...trades].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const rows=sorted.map(t=>{
    const date=new Date(t.date).toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit"});

    if(!t.checklistPassed){
      return `<tr>
        <td>${date}</td>
        <td class="pair">${t.pair||"—"}</td>
        <td colspan="5"><span class="result-rejected">🛑 נדחה</span><div class="fail-reason">${(t.failReason||"").replace(/🛑\s*/,"")}</div></td>
      </tr>`;
    }

    const dir=t.trend==="עולה"?`<span class="dir-long">▲ לונג</span>`:`<span class="dir-short">▼ שורט</span>`;
    const rrCls=t.rr>=2?"rr-good":"rr-bad";
    let result;
    if(t.result==null)result=`<span class="result-open">⏳ פתוחה</span>`;
    else if(t.result>0)result=`<span class="result-win">+$${t.result}</span>`;
    else result=`<span class="result-loss">$${t.result}</span>`;
    const lesson=t.lesson?`<div class="lesson">"${t.lesson}"</div>`:"";

    return `<tr>
      <td>${date}</td>
      <td class="pair">${t.pair}</td>
      <td>${dir}</td>
      <td>${t.entry}</td>
      <td class="${rrCls}">1:${t.rr}</td>
      <td>${t.riskPct}%</td>
      <td>${result}${lesson}</td>
    </tr>`;
  }).join("");

  tbody.innerHTML=`<table>
    <thead><tr><th>תאריך</th><th>זוג</th><th>כיוון</th><th>כניסה</th><th>R:R</th><th>סיכון</th><th>תוצאה</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

load();
setInterval(load,8000);
</script>
</body>
</html>
